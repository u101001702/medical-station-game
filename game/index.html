<title>急救站佈局挑戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：藍圖桌面。左＝功能區卡片匣，中＝平面圖（可縮放），右＝場地說明／選取資訊。刻意採單一深藍藍圖風，不隨系統深淺色切換 */
:root{
  --blue-deep:#0d2a47; --blue:#123a60; --blue-mid:#1b4a78; --line:#7fb4e3; --line-faint:rgba(127,180,227,.16);
  --chalk:#eaf4ff; --chalk-dim:#a9c4de; --ground:#16385a; --road:#0a2036;
  --ok:#7cffb2; --bad:#ff6b6b; --hl:#ffd23f;
  --panel:#0f3152; --panel-line:#2a5a87;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--blue-deep);color:var(--chalk)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue-deep)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box}
@media (min-width:600px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* 頂列 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px 8px;border-bottom:1px solid var(--panel-line)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.04em}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--chalk-dim);letter-spacing:.12em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--panel-line);background:transparent;border-radius:6px;padding:5px 12px;font-size:14px}
.tab[aria-selected="true"]{background:var(--chalk);color:var(--blue-deep);border-color:var(--chalk);font-weight:700}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.tbtn{border:1px solid var(--panel-line);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:13px;min-width:34px}
.tbtn:hover{border-color:var(--line)}
.tbtn[disabled]{opacity:.45;cursor:not-allowed}
.stage{font-family:var(--f-mono);font-size:11px;color:var(--chalk-dim);border:1px dashed var(--panel-line);border-radius:4px;padding:2px 8px}

/* 主區 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"pal side" "map side";gap:10px 12px;min-height:0;padding-block:10px 12px}
.palette{grid-area:pal}.mapwrap{grid-area:map}.side{grid-area:side}
.pane{background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;min-height:0;overflow:auto}
.pane h2{font-family:var(--f-display);font-size:16px;margin:0;padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
.pane .hint{font-size:12px;color:var(--chalk-dim);padding:0 12px 6px;margin:0}

/* 卡片匣 */
.palette{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:8px 10px;overflow:visible}
.palette h2{position:static;padding:0;background:none;font-size:15px}
.palette .hint{padding:0;flex:1 1 220px}
.cards{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.card{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--panel-line);background:var(--blue);border-radius:6px;padding:6px 10px;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;min-height:36px;box-sizing:border-box}
.card:hover{border-color:var(--line)}
.card .sw{width:12px;height:12px;border-radius:3px;flex:none}
.card .nm{font-weight:500;font-size:14px;white-space:nowrap}
.card .ct{font-family:var(--f-mono);font-size:11px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.card .ct.on{color:var(--ok)}
.card.sel{border-color:var(--hl)}

/* 地圖 */
.mapwrap{position:relative;background:var(--blue-deep);border:1px solid var(--panel-line);border-radius:8px;overflow:auto;min-height:0;touch-action:none}
.mapwrap svg{display:block}
.scale{position:sticky;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--chalk-dim);background:rgba(13,42,71,.8);padding:3px 8px;border-radius:4px;margin:0 0 8px 8px}
.scale i{display:inline-block;height:6px;border:1px solid var(--chalk-dim);border-top:none}

/* 右側面板 */
.info{padding:0 12px 14px;font-size:13.5px}
.info p{margin:6px 0}
.scenario{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--blue);font-size:13.5px}
.scenario b{font-family:var(--f-display);font-size:15px;display:block;margin-bottom:2px;color:var(--hl)}
.facts{margin:8px 0;padding-left:1.1em}
.facts li{margin:3px 0}
.legend{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:6px}
.legend svg{width:22px;height:16px}
.sub{font-family:var(--f-display);font-size:14.5px;margin:12px 0 4px;color:var(--chalk)}
.placed{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.placed li{display:flex;align-items:center;gap:6px;font-size:13px}
.placed .sw{width:10px;height:10px;border-radius:2px;flex:none}
.placed .a{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--chalk-dim)}
.sel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel-head b{font-family:var(--f-display);font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--chalk-dim)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.funcs{display:grid;gap:5px;margin:6px 0}
.func{display:flex;align-items:center;gap:6px;border:1px solid var(--panel-line);border-radius:5px;padding:4px 8px;background:var(--blue)}
.func .sw{width:10px;height:10px;border-radius:2px}
.func button{margin-left:auto;border:none;background:transparent;color:var(--chalk-dim);font-size:12px;padding:0 4px}
.func button:hover{color:var(--bad)}
.desc{font-size:12.5px;color:var(--chalk-dim)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts .tbtn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* 拖曳中的卡片 */
.floating{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--chalk);color:var(--blue-deep);font-weight:700;border-radius:6px;padding:4px 10px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--blue-deep);padding:6px 14px;border-radius:6px;font-size:13.5px;z-index:60;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:opacity .2s}

/* SVG 樣式 */
.c-floor{fill:var(--blue)}
.c-ground{fill:var(--ground)}
.c-road{fill:var(--road)}
.c-wall{fill:var(--line)}
.c-pillar{fill:var(--line)}
.c-toilet{fill:#2b5d8c}
.c-xray{fill:#3b4f78}
.gridline{stroke:var(--line-faint);stroke-width:.04}
.roomlbl{fill:var(--chalk-dim);font-family:var(--f-display);font-size:1.6px;text-anchor:middle;pointer-events:none}
.roomnote{fill:var(--hl);font-family:var(--f-body);font-size:1.1px;text-anchor:middle;pointer-events:none}
.outlbl{fill:rgba(169,196,222,.55);font-family:var(--f-display);font-size:1.6px;pointer-events:none}
.fxlbl{fill:var(--chalk);font-family:var(--f-body);font-size:1px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.zone rect.body{stroke-width:.18;cursor:move}
.zone text{pointer-events:none;text-anchor:middle;fill:#fff;font-family:var(--f-body);paint-order:stroke;stroke:rgba(10,30,55,.75);stroke-width:.25px}
.zone .zn{font-size:1.4px;font-weight:700}
.zone .za{font-size:1.1px;font-family:var(--f-mono)}
.zone.sel rect.body{stroke:var(--hl);stroke-width:.28}
.tape{cursor:pointer}.tape .sel{stroke:#fff;stroke-width:.16}
.handle{fill:var(--hl);stroke:var(--blue-deep);stroke-width:.14;cursor:nwse-resize}
.ghost{fill:rgba(124,255,178,.18);stroke:var(--ok);stroke-width:.2;stroke-dasharray:.5 .35;pointer-events:none}
.ghost.bad{fill:rgba(255,107,107,.18);stroke:var(--bad)}

/* 模擬 */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}.simbar[hidden]{display:none}
.simbar .clk{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--hl);font-variant-numeric:tabular-nums;min-width:4.2em}
.prog2{flex:1 1 120px;height:6px;background:var(--panel-line);border-radius:3px;overflow:hidden}
.prog2 i{display:block;height:100%;background:var(--hl)}
.tbtn.on{background:var(--chalk);color:var(--blue-deep);border-color:var(--chalk)}
.tbtn.go{border-color:var(--ok);color:var(--ok)}
.simming .cards,.simming .palette h2,.simming .palette .hint,.simming #tapeBtn{display:none}
#tapeBtn.on{background:var(--hl);color:#0b1d30}
.simming #runSim,.simming #clearMap{display:none}
.agent>*{stroke-width:.13}
.agent.waiting>*{stroke:#fff;stroke-dasharray:.25 .18;stroke-width:.16}
.fp{stroke-width:.14;pointer-events:none}
.ghost-size{fill:#fff;font-size:1.5px;font-weight:700;text-anchor:middle;pointer-events:none}
.plan{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:.07;pointer-events:none}
.plan-no{fill:#fff;fill-opacity:.55;font-size:.85px;text-anchor:middle;font-family:var(--f-mono);pointer-events:none}
.fp-aisle{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:.1;stroke-dasharray:.4 .3;pointer-events:none}
.caps{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.caps li{display:grid;grid-template-columns:4em 1fr auto;gap:6px;font-size:13px}
.caps b{font-family:var(--f-mono);font-weight:500}
.caps .q{font-family:var(--f-mono);font-size:12px;color:var(--chalk-dim)}
.caps .q.on{color:var(--hl)}
.params{margin-top:12px;font-size:12.5px;color:var(--chalk-dim)}
.params summary{cursor:pointer;color:var(--chalk)}
.params ul{padding-left:1.1em;margin:6px 0}
  .evpick{font-size:13px;color:var(--chalk-dim)}.evpick select{font:inherit;color:var(--chalk);background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;padding:4px}
.simming .evpick,.simming #tutBtn{display:none}
.tut{position:fixed;inset:0;z-index:70;background:rgba(5,16,30,.72);display:grid;place-items:center;padding:16px}.tut[hidden]{display:none}
.tutbox{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}.tutbox h3{font-family:var(--f-display);margin:4px 0;font-size:19px}.tutbox small{font-family:var(--f-mono);color:var(--chalk-dim)}
.items{display:grid;gap:5px;margin:6px 0}.items button{text-align:left}.items .tbtn.on{outline:2px solid var(--hl)}
.alerts{list-style:none;margin:6px 0;padding:0;display:grid;gap:5px}.alerts li{border-left:3px solid var(--hl);padding:3px 8px;font-size:12.5px;background:var(--blue);border-radius:0 5px 5px 0}.alerts li.bad{border-left-color:var(--bad)}.alerts b{display:block;font-weight:700}.alerts span{color:var(--chalk-dim)}
.evlog{border:1px solid var(--bad);border-radius:6px;padding:6px 8px;margin:8px 0;font-size:12.5px}.evlog b{color:var(--bad)}
.stars{font-size:26px;letter-spacing:.1em;color:var(--hl);line-height:1.2}.stars i{font-style:normal;color:var(--panel-line)}
.res{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}.res td{padding:3px 4px;border-top:1px solid var(--panel-line)}.res td:nth-child(2){font-family:var(--f-mono);white-space:nowrap;color:var(--ok)}.res td:nth-child(3){color:var(--chalk-dim);white-space:nowrap}.res tr.no td:nth-child(2){color:var(--bad)}
.fb{border-left:3px solid var(--hl);padding:2px 0 2px 8px;margin:6px 0;font-size:12.5px}.fb b,.fb span,.fb small{display:block}.fb small{color:var(--chalk-dim)}
@media (max-width:1100px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"pal" "map" "side"}
  .mapwrap{max-height:78vh}
  .side{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>急救站佈局挑戰</b><small>FIRST-AID STATION LAYOUT</small></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <span class="stage">第一層・站級配置</span>
    <div class="tools">
      <button class="tbtn" id="zoomOut" type="button" aria-label="縮小">－</button>
      <button class="tbtn" id="zoomFit" type="button">符合視窗</button>
      <button class="tbtn" id="zoomIn" type="button" aria-label="放大">＋</button>
      <button class="tbtn" id="clearMap" type="button">清空本圖</button>
      <label class="evpick">事件卡 <select id="evSel" aria-label="事件卡"></select></label>
      <button class="tbtn" id="tutBtn" type="button">教學</button>
      <button class="tbtn go" id="runSim" type="button">開始模擬</button>
    </div>
  </header>
  <div class="main">
    <aside class="pane palette">
      <h2>功能區卡片</h2>
      <p class="hint">封鎖線擋患者和擔架，工作人員可穿過。點卡片後在平面圖上拖曳畫出範圍，只點一下就用預設大小；也可以把卡片直接拖進平面圖，拖到已擺好的區塊上就是合併。同一張卡片可以擺很多次，相同區塊貼齊成長方形會自動併成一區。</p>
      <div class="cards" id="cards"></div>
      <button class="tbtn" id="tapeBtn" type="button">封鎖線</button>
      <div class="simbar" id="simbar" hidden></div>
    </aside>
    <div class="mapwrap" id="mapwrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="scale"><i id="scalebar"></i><span>1 格 = 0.5 m（4 格 = 1 m²，約 13 格 = 1 坪）</span></div>
    </div>
    <aside class="pane side">
      <h2 id="sideTitle">場地說明</h2>
      <div class="info" id="info"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tut" id="tut" hidden><div class="tutbox"><small id="tutN"></small><h3 id="tutT"></h3><p id="tutB"></p><div class="acts"><button class="tbtn" type="button" id="tutSkip">略過</button><button class="tbtn go" type="button" id="tutNext">下一步</button></div></div></div>

<script>
// ===== 基本設定 =====
const CELL_M = 0.5, PING_PER_CELL = CELL_M*CELL_M/3.3058;
const ping = n => (n*PING_PER_CELL).toFixed(1);

// 功能區定義（坪數來源：指引 p.10–16；標「遊戲假設」者為自訂）
const FUNCS = {
  triage:{name:'檢傷掛號',ping:4,src:'指引 p.10',where:'in',color:'#f39c4a',desc:'患者進站第一站：檢傷分級、掛號建檔、簡易除污。'},
  major:{name:'中重傷區',ping:7,src:'遊戲假設（與輕傷區合計 11 坪，指引 p.12）',where:'in',color:'#1fa89a',num:true,desc:'收治紅、黃患者：急救與治療，含一床急救床。客滿時與輕傷區互相支援。'},
  minor:{name:'輕傷區',ping:4,src:'遊戲假設（與中重傷區合計 11 坪，指引 p.12）',where:'in',color:'#7fe3cf',num:true,desc:'收治綠色患者：問診、傷口處理。客滿時與中重傷區互相支援。'},
  obs:{name:'留觀區',ping:6,src:'遊戲假設',where:'in',color:'#5aa9e6',desc:'短暫留觀或延長照護，等待轉出或出院。'},
  iso:{name:'隔離區',ping:3,src:'遊戲假設',where:'in',color:'#e05a9b',desc:'疑似傳染病患者使用，含穿脫防護裝備空間。'},
  pharm:{name:'藥局',ping:4,src:'指引 p.10',where:'in',color:'#7bd389',desc:'藥品調劑與領藥。'},
  store:{name:'庫備品區',ping:4,src:'指引 p.10',where:'in',color:'#c9d65b',desc:'藥品、衛材、重症設備（插管組、胸管組等）的庫存。'},
  public:{name:'公共空間',ping:5,src:'指引 p.10',where:'in',color:'#8fb8e3',desc:'候診、候藥、領藥，也是家屬等候的地方。'},
  waste:{name:'廢棄物處理區',ping:2,src:'指引 p.10',where:'in',color:'#b98a5e',desc:'醫療廢棄物暫存，等待清運。'},
  admin:{name:'行政區',ping:5,src:'指引 p.10',where:'in',color:'#a99be6',desc:'指揮中心：任務分派、對外通訊、文件管理。'},
  rest:{name:'人員休息／膳食',ping:3,src:'遊戲假設',where:'in',color:'#d7a6ef',desc:'工作人員休息、吃行動糧、喝水。'},
  morgue:{name:'罹難遺體管理區',ping:5,src:'指引 p.10',where:'any',color:'#8d90a8',desc:'遺體暫存，等待民政單位接手。室內室外都可以。'},
  amb:{name:'救護車停車',ping:null,src:'遊戲假設',where:'out',color:'#ff6b5e',size:[14,6],desc:'救護車停靠、上下患者、迴轉。只能放室外。'},
  gen:{name:'發電機',ping:null,src:'遊戲假設',where:'out',color:'#ffd23f',size:[4,4],desc:'備援電力。只能放室外。'},
};
const FUNC_ORDER = ['triage','major','minor','obs','iso','pharm','store','public','waste','admin','rest','morgue','amb','gen'];

// ===== 場地 =====
// 格子代碼：G 室外空地 R 道路 F 室內地板 W 牆 P 柱 D 門 S 樓梯口 M 坡道口 B 後門（台階） T 廁所 X 固定設備
function grid(W,H,c){return Array.from({length:H},()=>Array(W).fill(c))}
function fill(g,x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=c}
function box(g,x0,y0,x1,y1,c){fill(g,x0,y0,x1,y0,c);fill(g,x0,y1,x1,y1,c);fill(g,x0,y0,x0,y1,c);fill(g,x1,y0,x1,y1,c)}

// 畫面只顯示 (vx,vy) 以內；座標不動，已擺好的配置才不會跑掉
function crop(g,vx,vy){g.forEach((row,y)=>row.forEach((c,x)=>{if(x<vx||y<vy)row[x]='W'}))}

function mapClassroom(){
  const W=90,H=36,vx=19,vy=2,g=grid(W,H,'G'); crop(g,vx,vy); fill(g,88,vy,89,H-1,'R');
  box(g,23,4,80,28,'W'); fill(g,24,5,79,27,'F');
  [29,46,63].forEach(x=>fill(g,x,5,x,22,'W')); fill(g,24,23,79,23,'W');
  fill(g,24,5,28,16,'T'); fill(g,26,23,27,23,'D');
  const rooms=[{name:'廁所',x:24,y:5,w:5,h:18,small:1}];
  [30,47,64].forEach((x,i)=>{fill(g,x+2,23,x+3,23,'D');fill(g,x+12,23,x+13,23,'D');rooms.push({name:'教室 '+(i+1),x,y:5,w:16,h:18})});
  rooms[1].note='有水槽'; rooms[3].note='有後門（台階）';

function whereOf(funcs){
  const ws=new Set(funcs.map(f=>FUNCS[f].where)); ws.delete('any');

}
function cellKind(c){return c==='F'?'in':(c==='G'||c==='R')?'out':null}
function canPlace(r,funcs,ignoreId){
  const m=map(), where=whereOf(funcs); if(!where) return false;
  if(r.w<1||r.h<1||r.x<0||r.y<0||r.x+r.w>m.W||r.y+r.h>m.H) return false;
  let kind=null;
  for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
    const k=cellKind(m.g[y][x]); if(!k) return false;
    if(kind&&k!==kind) return false; kind=k;
  }
  if(where!=='any'&&kind!==where) return false;
  for(const z of zones()){ if(z.id===ignoreId) continue;
    if(r.x<z.x+z.w&&r.x+r.w>z.x&&r.y<z.y+z.h&&r.y+r.h>z.y) return false; }
  for(const t of tapes()) if(r.x<t.x+t.w&&r.x+r.w>t.x&&r.y<t.y+t.h&&r.y+r.h>t.y) return false;
  return true;
}

function tapeOK(r){const m=map(),[ax,ay]=ARRIVE[m.id];if(r.x<m.vx||r.y<m.vy||r.x+r.w>m.W||r.y+r.h>m.H)return false;
  for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)if(!WALKABLE.has(m.g[y][x])||(x===ax&&y===ay))return false;
  return !zones().some(z=>r.x<z.x+z.w&&r.x+r.w>z.x&&r.y<z.y+z.h&&r.y+r.h>z.y)}
// 功能相同、貼在一起且拼起來是長方形的區塊併成一區（區塊只能是長方形，L 形維持兩區）
function joinZones(list=zones()){let n=0,again=true;
  const same=(p,q)=>[...p.funcs].sort().join()===[...q.funcs].sort().join();
  while(again){again=false;
    for(const z of list){const o=list.find(q=>q!==z&&same(q,z)&&((q.y===z.y&&q.h===z.h&&q.x===z.x+z.w)||(q.x===z.x&&q.w===z.w&&q.y===z.y+z.h)));if(!o)continue;
      if(o.x>z.x)z.w+=o.w;else z.h+=o.h;
      z.items=[...(z.items||[]),...(o.items||[])];list.splice(list.indexOf(o),1);if(selected===o.id)selected=z.id;n++;again=true;break}}
  return n}

function defaultSize(f){
  const F=FUNCS[f]; if(F.size) return F.size.slice();
  const n=Math.round(F.ping/PING_PER_CELL); let h=Math.max(1,Math.round(Math.sqrt(n*0.8))); let w=Math.ceil(n/h); return [w,h];

// 依落點找可放的位置：先試預設大小（含平移），不行就縮小
function autoFit(f,cx,cy){
  const [dw,dh]=defaultSize(f); let best=null;
  const tryRect=(w,h)=>{
    const cand=[];
    for(let oy=0;oy<h;oy++)for(let ox=0;ox<w;ox++)cand.push({x:cx-ox,y:cy-oy,w,h});
    cand.sort((a,b)=>Math.hypot(a.x+w/2-cx-.5,a.y+h/2-cy-.5)-Math.hypot(b.x+w/2-cx-.5,b.y+h/2-cy-.5));
    return cand.find(r=>canPlace(r,[f]));
  };
  const r0=tryRect(dw,dh)||tryRect(dh,dw); if(r0) return r0;
  for(let w=dw;w>=1;w--)for(let h=dh;h>=1;h--){
    const r=tryRect(w,h); if(r&&(!best||w*h>best.w*best.h||(w*h===best.w*best.h&&Math.abs(w-h)<Math.abs(best.w-best.h))))best=r;
  }
  return best;
}

// ===== 區內配置（Sprint 7）=====
const ITEMS={cart:{name:'外傷治療車',ch:'車',w:2,h:1,color:'#ffb86b'},monitor:{name:'生理監視器',ch:'監',w:1,h:1,color:'#7fe0ff'},drug:{name:'急救藥箱',ch:'藥',w:1,h:1,color:'#ff9db0'},cabinet:{name:'物資櫃',ch:'櫃',w:2,h:1,color:'#c9d65b'}};
const hasItems=z=>z.funcs.some(f=>TWIN[f]||f==='obs');
let itemMode=null;
function itemCells(it){const I=ITEMS[it.k],c=[];for(let v=0;v<I.h;v++)for(let u=0;u<I.w;u++)c.push([it.x+u,it.y+v]);return c}
function placeItem(z,k,cx,cy){const I=ITEMS[k],it={k,x:cx,y:cy};
  if(cx<z.x||cy<z.y||cx+I.w>z.x+z.w||cy+I.h>z.y+z.h){toast('要擺在這個區塊裡面');return}
  const used=new Set((z.items||[]).flatMap(i=>itemCells(i)).map(c=>c.join()));
  if(itemCells(it).some(c=>used.has(c.join()))){toast('這格已經有東西');return}
  z.items=(z.items||[]).filter(i=>i.k!==k);z.items.push(it);itemMode=null;drawZones()}
function nearItem(pl,k){const z=zoneOfRect(pl.r);if(!z||!z.items)return false;const it=z.items.find(i=>i.k===k);if(!it)return false;
  const dx=Math.max(pl.r.x-it.x,it.x-(pl.r.x+pl.r.w),0),dy=Math.max(pl.r.y-it.y,it.y-(pl.r.y+pl.r.h),0);return (dx+dy)*CELL_M<=3}

// ===== 互動 =====
let drag=null; const floating=document.createElement('div'); floating.className='floating'; floating.hidden=true; document.body.appendChild(floating);
function toCell(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const ctm=svg.getScreenCTM();if(!ctm)return null;const p=pt.matrixTransform(ctm.inverse());return {fx:p.x,fy:p.y,cx:Math.floor(p.x),cy:Math.floor(p.y)}}
function overMap(ev){const r=wrap.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom}
function showGhost(r,ok){ghostLayer.innerHTML='';if(!r)return;el('rect',{x:r.x+.05,y:r.y+.05,width:r.w-.1,height:r.h-.1,rx:.27,class:'ghost'+(ok?'':' bad')},ghostLayer)}
let tapeMode=false, selTape=null;
$('#tapeBtn').addEventListener('click',()=>{tapeMode=!tapeMode;selected=null;infoFunc=null;selTape=null;drawZones()});
let toastT; function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1800)}

// 卡片：按下後移動超過 6px 才開始拖曳；沒移動就是點擊看說明
$('#cards').addEventListener('pointerdown',ev=>{
  if(mode==='sim') return;
  const card=ev.target.closest('.card'); if(!card) return;
  drag={kind:'pending',func:card.dataset.f,sx:ev.clientX,sy:ev.clientY,pid:ev.pointerId};
});
svg.addEventListener('pointerdown',ev=>{
  if(mode==='sim'){drag={kind:'pan',sx:ev.clientX,sy:ev.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,moved:false};return}
  if(itemMode){const c=toCell(ev),z=zones().find(q=>q.id===selected);
    if(z&&c&&c.cx>=z.x&&c.cy>=z.y&&c.cx<z.x+z.w&&c.cy<z.y+z.h){placeItem(z,itemMode,c.cx,c.cy);ev.preventDefault();return}
    itemMode=null;renderInfo()}  // 點到區塊外就取消，不要把地圖鎖住
  selTape=null;
  if(tapeMode){const c=toCell(ev);if(c){drag={kind:'tape',ax:c.cx,ay:c.cy,sx:ev.clientX,sy:ev.clientY,moved:false};ev.preventDefault()}return}
  const tg=ev.target.closest('[data-tape]');
  if(tg){selTape=+tg.dataset.tape;selected=null;infoFunc=null;drawZones();ev.preventDefault();return}
  const h=ev.target.closest('[data-handle]');
  if(h){const z=zones().find(q=>q.id==h.dataset.handle);drag={kind:'resize',z,w:z.w,h:z.h};ev.preventDefault();return}
  const g=ev.target.closest('.zone');
  if(g){const z=zones().find(q=>q.id==g.dataset.id);const c=toCell(ev);drag={kind:'move',z,ox:c.cx-z.x,oy:c.cy-z.y,x:z.x,y:z.y,moved:false,sx:ev.clientX,sy:ev.clientY};ev.preventDefault();return}
  if(infoFunc){const c=toCell(ev);if(c){drag={kind:'draw',func:infoFunc,ax:c.cx,ay:c.cy,sx:ev.clientX,sy:ev.clientY,moved:false};ev.preventDefault();return}}
  drag={kind:'pan',sx:ev.clientX,sy:ev.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,moved:false};
});
window.addEventListener('pointermove',ev=>{
  if(!drag) return;
  if(drag.kind==='pending'){ if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<6) return;
    drag.kind='new'; floating.textContent=FUNCS[drag.func].name; floating.hidden=false; }
  if(drag.kind==='new'){
    floating.style.left=ev.clientX+'px'; floating.style.top=ev.clientY+'px';
    if(overMap(ev)){const c=toCell(ev); const tz=zoneAt(c.cx,c.cy);
      if(tz){showGhost(tz,!!whereOf([...tz.funcs,drag.func]));drag.target={merge:tz};}
      else{const r=autoFit(drag.func,c.cx,c.cy);showGhost(r||{x:c.cx,y:c.cy,w:1,h:1},!!r);drag.target=r?{rect:r}:null;}
    } else {showGhost(null);drag.target=null}
    return;
  }
  if(drag.kind==='tape'){const c=toCell(ev);if(!c)return;
    if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>4) drag.moved=true;
    if(!drag.moved) return;
    const dx=Math.abs(c.cx-drag.ax),dy=Math.abs(c.cy-drag.ay),r=dx>=dy?{x:Math.min(drag.ax,c.cx),y:drag.ay,w:dx+1,h:1}:{x:drag.ax,y:Math.min(drag.ay,c.cy),w:1,h:dy+1};drag.r=r;
    showGhost(r,tapeOK(r));const t=el('text',{x:r.x+r.w/2,y:r.y+r.h/2-.8,class:'ghost-size'},ghostLayer);t.textContent=(Math.max(r.w,r.h)*CELL_M).toFixed(1)+' m';return}
  if(drag.kind==='draw'){const c=toCell(ev);if(!c)return;
    if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>4) drag.moved=true;
    if(!drag.moved) return;
    const r={x:Math.min(drag.ax,c.cx),y:Math.min(drag.ay,c.cy),w:Math.abs(c.cx-drag.ax)+1,h:Math.abs(c.cy-drag.ay)+1};drag.r=r;
    showGhost(r,canPlace(r,[drag.func],null));
    const t=el('text',{x:r.x+r.w/2,y:r.y+r.h/2+.5,class:'ghost-size'},ghostLayer);t.textContent=(r.w*r.h*PING_PER_CELL).toFixed(1)+' 坪';return}
  if(drag.kind==='move'){const c=toCell(ev);if(!c)return;
    if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>4) drag.moved=true;
    if(!drag.moved) return;
    drag.x=c.cx-drag.ox; drag.y=c.cy-drag.oy;
    const r={x:drag.x,y:drag.y,w:drag.z.w,h:drag.z.h}; showGhost(r,canPlace(r,drag.z.funcs,drag.z.id)); return;}
  if(drag.kind==='resize'){const c=toCell(ev);if(!c)return;
    drag.w=Math.max(1,Math.round(c.fx-drag.z.x)); drag.h=Math.max(1,Math.round(c.fy-drag.z.y));
    const r={x:drag.z.x,y:drag.z.y,w:drag.w,h:drag.h}; showGhost(r,canPlace(r,drag.z.funcs,drag.z.id)); return;}
  if(drag.kind==='pan'){const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;if(Math.hypot(dx,dy)>4)drag.moved=true;wrap.scrollLeft=drag.sl-dx;wrap.scrollTop=drag.st-dy}
});
window.addEventListener('pointerup',ev=>{
  if(!drag) return; const d=drag; drag=null; floating.hidden=true; showGhost(null);
  if(d.kind==='pending'){tapeMode=false;selTape=null;infoFunc=infoFunc===d.func?null:d.func;selected=null;drawZones();return}
  if(d.kind==='tape'){if(!d.moved)return;if(tapeOK(d.r)){tapes().push({id:state.nextId++,...d.r});drawZones()}else toast('封鎖線不能壓到牆、區塊或入口');return}
  if(d.kind==='draw'){  // 點卡片後在平面圖上拖曳畫出範圍；只點一下就用預設大小
    const c=toCell(ev),r=d.moved?d.r:c&&autoFit(d.func,c.cx,c.cy);
    if(!r||!canPlace(r,[d.func],null)){toast('這裡放不下');return}
    const z={id:state.nextId++,funcs:[d.func],...r};zones().push(z);selected=z.id;infoFunc=null;drawJoined();return}
  if(d.kind==='new'){
    if(!d.target) {if(overMap(ev))toast('這裡放不下');return}
    if(d.target.merge){const z=d.target.merge;
      if(!whereOf([...z.funcs,d.func])){toast('室內和室外的功能不能合併');return}
      if(z.funcs.includes(d.func)&&!FUNCS[d.func].num){toast('這個區塊已經有這項功能');return}
      if(z.funcs.includes(d.func)){toast('這個區塊已經有診療功能');return}
      z.funcs.push(d.func); selected=z.id; infoFunc=null; joinZones(); drawZones(); toast('已合併：'+zoneLabel(z).join('＋')); return}
    const z={id:state.nextId++,funcs:[d.func],...d.target.rect}; zones().push(z); selected=z.id; infoFunc=null; drawJoined(); return;
  }
  if(d.kind==='move'){
    if(!d.moved){selected=d.z.id;infoFunc=null;drawZones();return}
    const r={x:d.x,y:d.y,w:d.z.w,h:d.z.h}; if(canPlace(r,d.z.funcs,d.z.id)){d.z.x=d.x;d.z.y=d.y} else toast('這裡放不下');
    selected=d.z.id; drawJoined(); return;
  }
  if(d.kind==='resize'){const r={x:d.z.x,y:d.z.y,w:d.w,h:d.h}; if(canPlace(r,d.z.funcs,d.z.id)){d.z.w=d.w;d.z.h=d.h} else toast('這個大小放不下'); drawJoined(); return}
  if(d.kind==='pan'&&!d.moved&&mode==='layout'){ selected=null;infoFunc=null;drawZones() }
});
window.addEventListener('pointercancel',()=>{drag=null;floating.hidden=true;showGhost&&ghostLayer&&showGhost(null)});

$('#info').addEventListener('click',ev=>{
  if(ev.target.id==='tapeDel'){state.tapes[state.mapId]=tapes().filter(t=>t.id!==selTape);selTape=null;drawZones();toast('已刪除');return}
  const z=zones().find(q=>q.id===selected);
  if(ev.target.id==='back'){infoFunc=null;drawZones();return}
  if(!z) return;
  if(ev.target.id==='del'){state.layouts[state.mapId]=zones().filter(q=>q!==z);selected=null;drawZones();toast('已刪除');return}
  if(ev.target.id==='desel'){selected=null;drawZones();return}
  if(ev.target.id==='rot'){const r={x:z.x,y:z.y,w:z.h,h:z.w};if(canPlace(r,z.funcs,z.id)){z.w=r.w;z.h=r.h;drawJoined()}else toast('旋轉後放不下');return}
  const ik=ev.target.dataset.item; if(ik){itemMode=itemMode===ik?null:ik;renderInfo();return}
  const rm=ev.target.dataset.rmf; if(rm){z.funcs=z.funcs.filter(f=>f!==rm);drawJoined()}
});
window.addEventListener('keydown',ev=>{
  if((ev.key==='Delete'||ev.key==='Backspace')&&selTape&&!/input|textarea/i.test(document.activeElement.tagName)){state.tapes[state.mapId]=tapes().filter(t=>t.id!==selTape);selTape=null;drawZones();return}
  if((ev.key==='Delete'||ev.key==='Backspace')&&selected&&!/input|textarea/i.test(document.activeElement.tagName)){state.layouts[state.mapId]=zones().filter(q=>q.id!==selected);selected=null;drawZones()}
  if(ev.key==='Escape'){selected=null;infoFunc=null;itemMode=null;drawZones()}
});

  shuffle([...Array(7).fill('g'),'y','y','i'],r).forEach((c,i)=>list.push({t:i*720+r()*300,cat:c,str:false}));

  if(sp.kind==='seat') release(sp.s); else sim.stand[sp.c[1]*map().W+sp.c[0]]=0;
}
function nearFree(zs,str){
  const m=map(),W=m.W,seen=new Uint8Array(W*m.H),q=[];
  zs.forEach(z=>zoneCells(z).forEach(([x,y])=>{seen[y*W+x]=1;q.push([x,y])}));
  for(let i=0;i<q.length&&i<20000;i++){const [x,y]=q[i];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=m.H)continue;const j=ny*W+nx;if(seen[j])continue;seen[j]=1;
      if(!WALKABLE.has(m.g[ny][nx])||isStair(m.g[ny][nx])||sim.fp[j])continue;
      if(!sim.stand[j]&&!sim.slotCell[j]&&!sim.planCell[j]&&!sim.pkind[j]&&!sim.aisle[j]&&(!str||sim.wide[j])) return [nx,ny];
      q.push([nx,ny])}}
  return null;
}
function setGoal(a,targets,kind){a.goal=targets;a.goalKind=kind;a.field=getField(targets,a.str,!a.staff);a.fv=sim.ver;a.blocked=0}

// 抵達目標
function arrived(a){
  if(a.staff){staffArrived(a);return}
  const k=a.goalKind; a.goal=null; a.goalKind=null; dropCarry(a);
  if(k==='slot'){const f=a.slot.f; a.svc=f; a.moving=false; if(a.slot.s.rect) settle(a,a.slot.s);
    if(f==='morgue'){a.stage='body';return}
    a.timer=svcTime(a,f,a.slot.s); a.crew=[]; a.coming=0; a.await=crewFor(a,f); a.ss=sim.t; a.useF=f; a.stocked=false;
    a.crewUntil=f==='obs'?Math.max(0,a.timer-P.obsCheck):null; return}
  if(k==='exit'){leave(a,'discharged');return}
  if(k==='transfer'){leave(a,'transferred');return}
  if(k==='wait'&&a.spot&&a.spot.kind==='seat') settle(a,a.spot.s);
  // 'wait'：到等候位置，靜待叫號
}
function leave(a,why){a.gone=true; dropCarry(a); releaseCrew(a); if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)} freeSpot(a);
  sim.occ[a.cy*map().W+a.cx]-=a.str?2:1; sim.stats[why]++; sim.stats.waits.push(a.waitTotal); if(a.node){a.node.remove();a.node=null}}

// 服務完成後下一步
function done(a){
  const f=a.svc; a.svc=null;
  if(f==='triage'){a.triaged=true; sim.stats.triaged++; rel(a); route(a); return}
  if(TWIN[f]){if(a.worsen){worsen(a);return}
    sim.stats.treated++; addBag(f);
    if(a.cat==='r'||(a.cat==='y'&&a.obsPlan)) {toObs(a);return}
    toPharmOrExit(a); return}
  if(f==='iso'){sim.stats.treated++; addBag(f); transfer(a); return}
  if(f==='obs'){ addBag(f);
    if(a.cat==='r'||sim.rnd()<P.deteriorate*(a.slot&&a.slot.s.rect&&nearItem(a.slot.s,'monitor')?.5:1)){if(a.cat!=='r'){a.cat='r';sim.stats.deteriorated++} transfer(a); return}
    toPharmOrExit(a); return}
  if(f==='pharm'){exit(a);return}
  if(f==='hold'){ // 沒有留觀區時在診療床上留觀
    if(a.cat==='r'){transfer(a);return} toPharmOrExit(a); return}
}
// 輕症轉重症：改躺、改抬擔架，等中重傷區的床；等床時留在原位
function worsen(a){a.worsen=false;a.cat='r';a.lying=true;a.str=true;a.moving=true;sim.occ[a.cy*map().W+a.cx]+=1;sim.stats.deteriorated++;
  if(a.node){a.node.remove();a.node=null}
  if(has('major'))want(a,'major');else wantTreat(a)}
function route(a){
  if(a.cat==='b'){ if(has('morgue')) want(a,'morgue'); else {a.stage='body'; if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)} goWait(a,'triage')} return}
  if(a.cat==='i'&&has('iso')){want(a,'iso');return}
  if(a.cat==='i'){a.exposure=true; a.cat='y';}
  if(a.cat==='y') a.obsPlan=sim.rnd()<P.yObsRate;
  if(has('major')||has('minor')) wantTreat(a);
  else {a.stage='untreated'; if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)} goWait(a,'triage'); sim.stats.noTreat++}
}
function toObs(a){
  if(has('obs')) want(a,'obs');
  else {a.svc='hold'; a.timer=a.cat==='r'?P.t.obsR:P.t.obsY}   // 佔著診療床留觀
}
function rel(a){if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)}}
function toPharmOrExit(a){ rel(a); if(has('pharm')) want(a,'pharm'); else exit(a) }
function exitCells(){const m=map(),c=[];for(let y=0;y<m.H;y++)for(let x=0;x<m.W;x++)if('SMB'.includes(m.g[y][x]))c.push([x,y]);return c}
function exit(a){ if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)} setGoal(a,sim.exits,'exit') }
function transfer(a){
  if(sim.noAmb&&a.slot){a.svc='hold';a.timer=600;return}
  if(a.slot){const s=a.slot;a.slot=null;freeSlot(s)}
  const amb=zones().filter(z=>z.funcs.includes('amb'));
  setGoal(a,amb.length?amb.flatMap(zoneCells):[ARRIVE[map().id]],'transfer');
}

// 動線交叉：隔離患者、遺體、廢棄物穿過公共空間或診療區（指標 7）
function noteCross(a){const i=a.cy*map().W+a.cx,b=sim.zbit[i];if(!b)return;
  if(a.staff){const t=a.task;if(t&&t.k==='waste'&&t.got&&!t.crossed&&((b&1)||!zoneCells(firstZone(t.f)).some(([x,y])=>x===a.cx&&y===a.cy))){t.crossed=true;sim.stats.cross++;sim.stats.crossWaste++}return}
  if(a.crossed)return;
  if((a.cat==='i'||a.exposure)&&(b&1)){a.crossed=true;sim.stats.cross++;sim.stats.crossIso++}
  else if(a.cat==='b'&&a.triaged&&(b&1)){a.crossed=true;sim.stats.cross++;sim.stats.crossBody++;
    const v=sim.staff.find(x=>PORTERS.includes(x.role)&&x.state==='idle');if(v){v.state='busy';v.task={k:'calm'};v.goal=null;v.timer=300;v.onDone=()=>freeStaff(v)}}
}

// ---- 移動 ----
function moveAgent(a,dt){
  const m=map(),W=m.W; if(a.fv!==sim.ver){a.field=getField(a.goal,a.str,!a.staff);a.fv=sim.ver}
  const ci=a.cy*W+a.cx;let d=a.field;
  if(a.moving&&d[ci]===Infinity)d=getField(a.goal,false,true);   // 轉重症的擔架先從座位間擠出來
  const atCenter=Math.abs(a.x-a.cx)<.02&&Math.abs(a.y-a.cy)<.02;
  if(atCenter){
    if(d[ci]===0){arrived(a);return}
    if(d[ci]===Infinity){a.noWay=a.noWay||sim.t;if(!a.stuck&&!a.staff&&sim.t-a.noWay>300){a.stuck=true;sim.stats.stuck++}return}
    a.noWay=0;
    let best=null,bv=d[ci];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=a.cx+dx,ny=a.cy+dy;if(nx<0||ny<0||nx>=W||ny>=m.H)continue;
      const v=d[ny*W+nx];if(v<bv-1e-6){if(dx&&dy&&(d[a.cy*W+nx]===Infinity||d[ny*W+a.cx]===Infinity))continue;bv=v;best=[nx,ny]}}
    if(!best)return;
    const j=best[1]*W+best[0],w=a.str?2:1;
    if(sim.occ[j]+w>P.cellCap&&a.blocked<P.squeezeAfter){a.blocked+=dt;sim.block[j]+=dt;return}
    a.blocked=0; sim.occ[ci]-=w; sim.occ[j]+=w; a.cx=best[0]; a.cy=best[1];
    const k=Math.min(ci,j)+'-'+Math.max(ci,j),mark=(r,n)=>r.set(k,(r.get(k)||0)+n);
    if(a.staff||a.carried)mark(sim.staffRoutes,a.staff?1:2);if(!a.staff&&a.cat!=='b'&&a.stage!=='body')mark(sim.routes,1);
  }
  const c=m.g[a.cy][a.cx]; let sp=P.walk*(a.str?P.stretcherMul:1); if(isStair(c)) sp*=a.str?P.stairStretcherMul:P.stairWalkMul;
  if(sim.cord[a.cy*W+a.cx]) sp*=a.str?P.cordStr:P.cordWalk;
  noteCross(a);
  const dx=a.cx-a.x,dy=a.cy-a.y,dist=Math.hypot(dx,dy),step=sp*dt;
  if(dist<=step){a.x=a.cx;a.y=a.cy} else {a.x+=dx/dist*step;a.y+=dy/dist*step}
  sim.stats[a.staff?'staffWalk':'patientWalk']+=Math.min(step,dist)*CELL_M;
}

function tick(dt){
  while(sim.sched.length&&sim.sched[0].t<=sim.t) spawn(sim.sched.shift());
  if(sim.evKey&&!sim.evFired&&sim.t>=EV_T) fireEvent();
  const rate=sim.t<(sim.outUntil||0)&&!firstZone('gen')?1/OUT_MUL:1;
  const W=map().W;
  for(const a of sim.agents){ if(a.gone) continue;
    if(a.goal){if(a.str&&!a.carried){askCarry(a);continue} moveAgent(a,dt);continue}
    if(a.await){if(a.await.length||a.coming)continue;a.await=null;a.waitTotal+=sim.t-a.ss;a.ss=null;
      if(!a.stocked){a.stocked=true;if(!takeStock(a,a.useF)){a.noStock=sim.t;sim.stats.stockouts++}askFetch(a)}}
    if(a.noStock!=null){const late=sim.t-a.noStock>=P.improvise;if(!late&&!takeStock(a,a.useF))continue;sim.stats.supplyDelay+=Math.min(sim.t-a.noStock,P.improvise);a.noStock=null}
    if(a.fetchAt!=null&&a.timer<=a.fetchAt){sim.stats.supplyDelay+=dt;continue}
    if(a.timer>0){a.timer-=dt*rate;
      if(a.crewUntil!=null&&a.timer<=a.crewUntil){releaseCrew(a);a.crewUntil=null}
      if(a.timer<=0){a.timer=0;releaseCrew(a);done(a)}}
  }
  for(const s of sim.staff) tickStaff(s,dt);
  dispatch();
  if(sim.t>=sim.nextScan){sim.nextScan=sim.t+15;scanAlerts()}
  sim.t+=dt;
}

// ---- 現場狀況：模擬時每 15 秒掃描一次，顯示在側欄與地圖上（佈置時不提示）----
const ALERT_HOLD=60;
function scanAlerts(){
  const live=sim.agents.filter(a=>!a.gone),old=k=>k/60>=1?Math.round(k/60):1,al=sim.alerts;
  const hit=(key,level,n,text,tip,f)=>{const o=al.get(key)||{key,level,first:sim.t,peak:0};al.set(key,o);Object.assign(o,{last:sim.t,text,tip,f});if(n>o.peak){o.peak=n;o.peakText=text}};
  const need=(a,r)=>a.await&&a.await.includes(r);
  const rd=live.filter(a=>a.cat==='r'&&need(a,'doc')&&sim.t-a.ss>120);
  if(rd.length)hit('rdoc','bad',rd.length,`${rd.length} 名重症在等醫師，最久 ${old(Math.max(...rd.map(a=>sim.t-a.ss)))} 分`,'這是人手瓶頸，改配置解決不了；要靠重症優先或請求支援','major');
  const dn=live.filter(a=>a.cat!=='r'&&need(a,'doc')&&sim.t-a.ss>600);
  if(dn.length)hit('wdoc','warn',dn.length,`${dn.length} 名輕、中症等醫師超過 10 分`,'醫師都在處置重症，輕症要先安撫、定時回頭評估',dn[0].useF);
  const rn=live.filter(a=>a.cat==='r'&&need(a,'nurse')&&!need(a,'doc')&&sim.t-a.ss>120);
  if(rn.length)hit('rnur','bad',rn.length,`${rn.length} 名重症在等護理師`,'床邊護理人力不足，留意檢傷以外的調度','major');
  const cs=live.filter(a=>a.cs!=null&&sim.t-a.cs>180);
  if(cs.length)hit('carry','bad',cs.length,`${cs.length} 名擔架患者等人抬，最久 ${old(Math.max(...cs.map(a=>sim.t-a.cs)))} 分`,'擔架一趟要 2 人；救護車區、檢傷、中重傷區靠近一點，每趟就短','amb');
  const nw=live.filter(a=>a.noWay&&sim.t-a.noWay>60);
  if(nw.length)hit('noway','bad',nw.length,`${nw.length} 名患者的路被擋住`,'擔架要 1 m 寬的走道，也不能穿過遺體、庫備品、廢棄物區或封鎖線',nw[0].useF);
  const lane=(f,min,text,tip)=>{const q=sim.R[f].queue.filter(a=>!a.gone&&a.waitSince!=null&&sim.t-a.waitSince>60);if(q.length>=min)hit('q'+f,f==='major'?'bad':'warn',q.length,text(q.length),tip,f)};
  lane('major',1,n=>`中重傷區沒有空床，${n} 人在等`,'區塊拉大，或讓處置完的重症盡快到留觀區');
  lane('minor',1,n=>`輕傷區沒有空位，${n} 人在候診`,'輕傷區拉大，或留意是否被中重症佔用');
  lane('obs',1,n=>`留觀區客滿，${n} 人佔著診療床等待`,'留觀區太小會回堵診療區（指引 p.13）');
  lane('iso',1,n=>`隔離區客滿，${n} 人在等`,'隔離區要有獨立空間與動線（指引 p.14）');
  lane('triage',3,n=>`檢傷排隊 ${n} 人`,'把公共空間轉成檢傷擴充區（指引 p.12、p.15）');
  lane('pharm',3,n=>`藥局排隊 ${n} 人`,'領藥要有等候空間，別讓隊伍擋到走道（指引 p.15）');
  const st=live.filter(a=>a.spot&&a.spot.kind==='stand'&&!a.str);
  if(st.length>=3)hit('stand','warn',st.length,`${st.length} 人站著等，候診座位不夠`,'公共空間拉大（指引 p.15）','public');
  const pa=live.filter(a=>a.fetchAt!=null&&a.timer<=a.fetchAt);
  if(pa.length)hit('fetch','bad',pa.length,`${pa.length} 位處置暫停，物資還沒送到`,'藥局、庫備品區放近中重傷區（指引 p.14–15）','store');
  const ns=live.filter(a=>a.noStock!=null&&!a.await);
  if(ns.length)hit('stock','bad',ns.length,`${FNAME[ns[0].useF]||ns[0].useF}物資斷貨，${ns.length} 位處置受影響`,'庫備品區放近一點，補貨才跟得上（指引 p.14–15）',ns[0].useF);
  if(sim.jobs.length>=3)hit('jobs','warn',sim.jobs.length,`後勤待辦 ${sim.jobs.length} 件`,'志工、替代役都在抬擔架，補貨、清運、領物資只能排隊','store');
  if(sim.t<(sim.outUntil||0)&&!firstZone('gen'))hit('out','bad',1,'停電中，處置變慢','發電機放室外並接到醫療區（指引附件五）','major');
  const c=sim.stats;
  const fresh=k=>{const n=c[k];if(n>(sim.seen[k]||0)){sim.seen[k]=n;return true}return false};
  if(fresh('crossIso'))hit('xiso','warn',c.crossIso,`疑似傳染患者穿過公共空間 ${c.crossIso} 次`,'隔離區靠近入口，動線不經公共空間（指引 p.14）','iso');
  if(fresh('crossBody'))hit('xbody','warn',c.crossBody,`遺體穿過公共空間 ${c.crossBody} 次`,'遺體路線與公共空間隔離（指引 p.16）','morgue');
  if(fresh('crossWaste'))hit('xwaste','warn',c.crossWaste,`廢棄物穿過公共空間或診療區 ${c.crossWaste} 次`,'廢棄物走獨立路線（指引 p.15）','waste');
  drawAlerts()}
const liveAlerts=()=>[...sim.alerts.values()].filter(o=>sim.t-o.last<=ALERT_HOLD).sort((p,q)=>(p.level==='bad'?0:1)-(q.level==='bad'?0:1)||p.first-q.first);
const ALERT_TAG={rdoc:'等醫師',wdoc:'等醫師',rnur:'等護理師',carry:'等人抬',noway:'路被擋住',qmajor:'沒有空床',qminor:'沒有空位',qobs:'留觀客滿',qiso:'隔離客滿',qtriage:'檢傷排隊',qpharm:'藥局排隊',stand:'座位不夠',fetch:'等物資',stock:'斷貨',jobs:'後勤塞車',out:'停電',xiso:'傳染交叉',xbody:'遺體交叉',xwaste:'廢棄物交叉'};
function drawAlerts(){alertLayer.innerHTML='';const by=new Map(),m=map(),fs=1.2;
  liveAlerts().forEach(o=>{const z=firstZone(o.f)||zones().find(q=>q.funcs.some(f=>TWIN[f]));if(!z)return;if(!by.has(z.id))by.set(z.id,{z,l:[]});by.get(z.id).l.push(o)});
  by.forEach(({z,l})=>{const col=l[0].level==='bad'?'var(--bad)':'var(--hl)',x=z.x+z.w-.6,y=z.y+.6;
    el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:.3,fill:'none',stroke:col,'stroke-width':.22,'stroke-dasharray':'.8 .5'},alertLayer);
    const tags=[...new Set(l.map(o=>ALERT_TAG[o.key]))],s=tags.slice(0,2).join('、')+(tags.length>2?` +${tags.length-2}`:''),w=[...s].reduce((n,c)=>n+(c.charCodeAt(0)>255?fs:fs*.6),.8);
    const px=x-1.25-w>=m.vx+.2?x-1.25-w:x+1.25;
    el('rect',{x:px,y:y-1,width:w,height:2,rx:.4,fill:col,stroke:'#0b1d30','stroke-width':.1},alertLayer);
    const lb=el('text',{x:px+w/2,y:y+.43,'text-anchor':'middle','font-size':fs+'px','font-weight':700,fill:'#0b1d30'},alertLayer);lb.textContent=s;
    el('circle',{cx:x,cy:y,r:1.15,fill:col,stroke:'#0b1d30','stroke-width':.14},alertLayer);
    const t=el('text',{x,y:y+.55,'text-anchor':'middle','font-size':'1.6px','font-weight':700,fill:'#0b1d30'},alertLayer);t.textContent='!'})}
function alertsHTML(){const l=liveAlerts(),one=o=>`<li class="${o.level}"><b>${o.text}</b><span>${o.tip}</span></li>`;
  return `<div class="sub">現場狀況</div>${l.length?`<p class="desc">驚嘆號：紅＝卡住處置，黃＝要留意</p><ul class="alerts">${l.slice(0,4).map(one).join('')}</ul>${l.length>4?`<p class="desc">還有 ${l.length-4} 項</p>`:''}`:'<p class="desc">目前運作順暢。</p>'}`}
function alertLog(){const l=[...sim.alerts.values()].sort((p,q)=>p.first-q.first);if(!l.length)return '<p class="desc">這一輪沒有偵測到異常。</p>';
  return `<ul class="alerts">${l.map(o=>`<li class="${o.level}"><b>${clock(o.first)}–${clock(o.last)}　${o.peakText}</b><span>${o.tip}</span></li>`).join('')}</ul>`}

// ---- 繪製 ----
function drawAgents(){
  for(const a of sim.agents){ if(a.gone) continue;
    if(!a.node){a.node=el('g',{class:'agent'},agentLayer);
      if(a.str) el('rect',{x:-.76,y:-.43,width:1.52,height:.86,rx:.2},a.node); else el('circle',{r:.54},a.node);}
    const col=!a.triaged?'#f4f8ff':(a.stage==='body'?CAT.b.color:CAT[a.exposure?'i':a.cat].color);
    const sh=a.node.firstChild; sh.setAttribute('fill',col); sh.setAttribute('stroke',a.stage==='body'?'#fff':'#0b1d30');
    a.node.setAttribute('transform',`translate(${(a.x+.5).toFixed(3)},${(a.y+.5).toFixed(3)})`);
    a.node.classList.toggle('waiting',(a.waitFor!=null||!!a.await||a.noStock!=null)&&!a.goal);
  }
  // 人員重疊時在畫面上錯開（只影響顯示）：走動的人照原位，停著的人找旁邊沒人的地方
  const drawn=sim.staff.filter(s=>s.goal).map(s=>{s.dx=s.dy=0;return s});
  sim.staff.filter(s=>!s.goal).forEach(s=>{const hit=(u,v)=>drawn.some(o=>Math.abs(o.x+o.dx-s.x-u)<1.3&&Math.abs(o.y+o.dy-s.y-v)<1.3);
    [s.dx,s.dy]=[[0,0],[1.7,0],[-1.7,0],[0,1.7],[0,-1.7],[1.7,1.7],[-1.7,1.7],[1.7,-1.7],[-1.7,-1.7]].find(([u,v])=>!hit(u,v))||[0,0];drawn.push(s)});
  for(const s of sim.staff){
    if(!s.node){s.node=el('g',{class:'staff'},agentLayer);const R=ROLES[s.role];el('rect',{x:-.8,y:-.8,width:1.6,height:1.6,rx:.3,fill:R.color,stroke:'#0b1d30','stroke-width':.14},s.node);
      const t=el('text',{x:0,y:.5,'text-anchor':'middle','font-size':'1.3px','font-weight':700,fill:'#0b1d30','font-family':'var(--f-body)'},s.node);t.textContent=R.ch}
    s.node.setAttribute('transform',`translate(${(s.x+.5+s.dx).toFixed(3)},${(s.y+.5+s.dy).toFixed(3)})`);
    s.node.style.opacity=s.task&&s.task.k==='need'?.45:1;

    <dl class="kv"><dt>時間</dt><dd>${clock(sim.t)}（第 ${Math.floor(sim.t/60)} 分）</dd>
      <dt>已進站</dt><dd>${s.arrived} / ${sim.total+sim.extra} 人</dd><dt>站內</dt><dd>${inside.length} 人（等候中 ${waitingNow.length}）</dd>
      <dt>完成處置</dt><dd>${s.treated} 人${s.supported?`（跨區支援 ${s.supported}）`:''}</dd><dt>出院</dt><dd>${s.discharged} 人</dd><dt>轉出</dt><dd>${s.transferred} 人${s.deteriorated?`（含惡化 ${s.deteriorated}）`:''}</dd>
      <dt>最長等候</dt><dd>${Math.round(maxWait/60)} 分</dd><dt>患者總步行</dt><dd>${Math.round(s.patientWalk)} m</dd>
      ${s.stuck?`<dt>到不了</dt><dd style="color:var(--bad)">${s.stuck} 人</dd>`:''}</dl>
    <div class="sub">人員</div><ul class="caps">${Object.keys(ROLES).map(k=>{const l=sim.staff.filter(x=>x.role===k),b=l.filter(x=>x.state==='busy'&&x.task&&x.task.k!=='need').length,o=l.filter(x=>x.task&&x.task.k==='need').length;return `<li><span>${ROLES[k].name}</span><b>${l.length} 人</b><span class="q${b+o>=l.length?' on':''}">忙 ${b}${o?`・離崗 ${o}`:''}</span></li>`}).join('')}</ul>
    <dl class="kv"><dt>人員總步行</dt><dd>${Math.round(s.staffWalk)} m</dd><dt>擔架搬運</dt><dd>${s.carries} 趟</dd>${s.preempted?`<dt>重症插隊</dt><dd>${s.preempted} 次</dd>`:''}<dt>物資斷貨</dt><dd>${s.stockouts} 次${s.supplyDelay?`（延誤 ${Math.round(s.supplyDelay/60)} 分）`:''}</dd><dt>廢棄物清運</dt><dd>${s.wasteDone} 袋</dd></dl>
    <div class="sub">位子與排隊</div><ul class="caps">${cap||'<li>沒有可提供服務的區塊</li>'}</ul>
    ${cramped.length?`<p class="desc">面積不足、處置變慢：${cramped.join('、')}</p>`:''}
    ${missing.length?`<p class="desc">這次沒有擺：${missing.join('、')}</p>`:''}
    <div class="sub">圖例</div>
    <div class="legend">
      ${legendRow('<circle cx="11" cy="8" r="5" fill="#f4f8ff" stroke="#0b1d30"/>','尚未檢傷')}
      ${['g','y','r','i'].map(k=>legendRow(`<circle cx="11" cy="8" r="5" fill="${CAT[k].color}" stroke="#0b1d30"/>`,CAT[k].name)).join('')}
      ${legendRow('<circle cx="11" cy="8" r="5" fill="#15181c" stroke="#fff"/>','死亡')}
      ${legendRow('<rect x="3" y="4" width="16" height="9" rx="2" fill="#f2c230" stroke="#0b1d30"/>','擔架患者')}
      ${legendRow('<circle cx="11" cy="8" r="6" fill="none" stroke="#fff" stroke-dasharray="2 2"/>','等候叫號或等人手')}
      ${legendRow('<rect x="4" y="1" width="14" height="14" rx="3" fill="#fff" stroke="#0b1d30"/>','工作人員（方塊標示職務，變淡＝離崗）')}
    </div>
    <details class="params"><summary>模擬參數（遊戲假設）</summary><ul>${PARAM_TEXT.map(t=>`<li>${t}</li>`).join('')}</ul></details>`;
}
$('#simbar').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-sim]'); if(!b||!sim) return; const k=b.dataset.sim;
  if(k==='toggle'&&!sim.ended){sim.running=!sim.running;lastFrame=performance.now()}
  if(k==='speed') sim.speed=+b.dataset.v;
  if(k==='heat'){sim[b.dataset.v]=!sim[b.dataset.v];drawHeat()}
  if(k==='restart'){startSim();return}
  if(k==='back'){stopSim();return}
  renderSimBar();
});
$('#info').addEventListener('click',ev=>{if(ev.target.id==='dlCard'&&sim)downloadCard()});
$('#runSim').onclick=()=>startSim();
$('#evSel').innerHTML='<option value="">不抽（第一輪）</option><option value="rand">隨機抽一張</option>'+Object.keys(EVENTS).map(k=>`<option value="${k}">${EVENTS[k].name}</option>`).join('');
// 重新開始時沿用同一張牌，才能比較改版前後
let rolled='';function evPick(){const v=$('#evSel').value;if(v!=='rand')return v;if(!rolled){const ks=Object.keys(EVENTS);rolled=ks[Math.floor(Math.random()*ks.length)]}return rolled}
$('#evSel').onchange=()=>{rolled=''};
// 新手教學
const TUT=[['擺放功能區','點上方卡片，再到平面圖上拖曳畫出範圍；拖右下角黃點調大小。1 格是 0.5 m，4 格是 1 平方公尺。'],['想清楚動線','患者從檢傷進站，重症要到中重傷區，疑似傳染要去隔離區。患者是障礙物，一定要留通道。'],['按開始模擬','4 小時壓縮成約 3 分鐘。看誰在等，等的是床位，還是醫師、護理師或擔架人手。'],['看結算再改版','結束後看 7 項指標和回饋，改配置後再跑一次。第二輪從上方選事件卡。']];
let tutI=0;function tutShow(){const [t,b]=TUT[tutI];$('#tutN').textContent=`${tutI+1} / ${TUT.length}`;$('#tutT').textContent=t;$('#tutB').textContent=b;$('#tutNext').textContent=tutI===TUT.length-1?'開始佈置':'下一步';$('#tut').hidden=false}
function tutClose(){$('#tut').hidden=true;try{localStorage.setItem('mrs-tut-v1','1')}catch(e){}}
$('#tutBtn').onclick=()=>{tutI=0;tutShow()};$('#tutSkip').onclick=tutClose;$('#tutNext').onclick=()=>{if(++tutI>=TUT.length)tutClose();else tutShow()};

// 頂列
function renderTabs(){$('#tabs').innerHTML=MAPS.map(m=>`<button class="tab" role="tab" type="button" aria-selected="${m.id===state.mapId}" data-m="${m.id}">${m.tab}</button>`).join('')}
$('#tabs').addEventListener('click',ev=>{const b=ev.target.closest('.tab');if(!b)return;if(mode==='sim')stopSim();state.mapId=b.dataset.m;selected=null;infoFunc=null;renderTabs();drawBase();drawZones()});
$('#zoomIn').onclick=()=>{state.zoom=Math.min(3,state.zoom*1.25);applyZoom();save()};
$('#zoomOut').onclick=()=>{state.zoom=Math.max(.5,state.zoom/1.25);applyZoom();save()};
$('#zoomFit').onclick=()=>{state.zoom=1;applyZoom();save()};
let clearArmed=false,clearT;
$('#clearMap').onclick=ev=>{
  if(mode==='sim'||!zones().length) return;
  if(!clearArmed){clearArmed=true;ev.target.textContent='再按一次確認清空';clearTimeout(clearT);clearT=setTimeout(()=>{clearArmed=false;ev.target.textContent='清空本圖'},2500);return}
  clearArmed=false;ev.target.textContent='清空本圖';state.layouts[state.mapId]=[];state.tapes[state.mapId]=[];selected=null;selTape=null;drawZones();toast('已清空');
};
window.addEventListener('resize',()=>applyZoom());

function start(data){
  load(); if(data&&data.layouts&&data.v===2) state=Object.assign(state,data);
  MAPS.forEach(m=>state.layouts[m.id]=(state.layouts[m.id]||[]).filter(z=>z.x>=m.vx&&z.y>=m.vy&&z.x+z.w<=m.W&&z.y+z.h<=m.H&&!zoneCells(z).some(([x,y])=>'WT'.includes(m.g[y][x]))));   // 地圖改過後，超出範圍或壓到牆的區塊拿掉
  MAPS.forEach(m=>joinZones(state.layouts[m.id]));
  renderTabs(); drawBase(); drawZones();
  let seen=false;try{seen=!!localStorage.getItem('mrs-tut-v1')}catch(e){} if(!seen){tutI=0;tutShow()}
}
window.claude?.hot?.snapshot?.(()=>state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
