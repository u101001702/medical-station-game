<title>急救站遊戲規則審核</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：審核表。頂端進度列 sticky，下方依章節列出每條規則，右側三顆判定鈕＋備註 */
:root{
  --bg:#f5f7fa; --paper:#ffffff; --ink:#14263a; --soft:#5b6b7d; --line:#d9e1ea;
  --accent:#1f5c99; --ok:#1e7a46; --ok-bg:#e3f3ea; --chg:#b4511c; --chg-bg:#fbeadf; --ask:#7a5a00; --ask-bg:#fbf1d2;
  --tag-g:#e3ecf7; --tag-k:#efe6f8; --tag-a:#eef0f2;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a27; --paper:#15263a; --ink:#e6eef7; --soft:#9fb2c6; --line:#2a3f57;
  --accent:#7fb4e3; --ok:#6fd49a; --ok-bg:#163a29; --chg:#f2a173; --chg-bg:#41261a; --ask:#f0cf6a; --ask-bg:#3a3115;
  --tag-g:#1d3552; --tag-k:#33264a; --tag-a:#22313f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a27; --paper:#15263a; --ink:#e6eef7; --soft:#9fb2c6; --line:#2a3f57;
  --accent:#7fb4e3; --ok:#6fd49a; --ok-bg:#163a29; --chg:#f2a173; --chg-bg:#41261a; --ask:#f0cf6a; --ask-bg:#3a3115;
  --tag-g:#1d3552; --tag-k:#33264a; --tag-a:#22313f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
h1{font-size:1.55rem;margin:0;text-wrap:balance}
.lead{color:var(--soft);margin:0;max-width:68ch}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:var(--soft)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:18px}
.prog{flex:1 1 220px;min-width:0}
.prog .nums{font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;margin-top:4px}
.track i{display:block;height:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.fbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 12px;font-size:.85rem}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.save{font-size:.8rem;color:var(--soft);min-width:9em;text-align:right}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-bottom:8px}
nav.toc a{color:var(--accent);text-decoration:none}
nav.toc a:hover{text-decoration:underline}
section{margin-top:26px}
section h2{font-size:1.1rem;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
section h2 small{font-weight:400;font-size:.8rem;color:var(--soft)}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;margin-bottom:8px}
.rule[data-s="ok"]{border-left:4px solid var(--ok)}
.rule[data-s="change"]{border-left:4px solid var(--chg)}
.rule[data-s="ask"]{border-left:4px solid var(--ask)}
.rule .txt{min-width:0}
.rule .id{font-family:var(--f-mono);font-size:.75rem;color:var(--soft);margin-right:6px}
.rule p{margin:0}
.rule ul{margin:4px 0 0;padding-left:1.2em}
.tag{display:inline-block;font-size:.72rem;border-radius:4px;padding:0 6px;margin:4px 6px 0 0;color:var(--ink)}
.tag.v{background:var(--ok-bg);color:var(--ok);font-weight:700}.tag.g{background:var(--tag-g)} .tag.k{background:var(--tag-k)} .tag.a{background:var(--tag-a)}
.acts{display:flex;gap:6px;align-items:flex-start}
.acts button{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:6px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.acts button[aria-pressed="true"][data-v="ok"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.acts button[aria-pressed="true"][data-v="change"]{background:var(--chg-bg);border-color:var(--chg);color:var(--chg);font-weight:700}
.acts button[aria-pressed="true"][data-v="ask"]{background:var(--ask-bg);border-color:var(--ask);color:var(--ask);font-weight:700}
.note{grid-column:1/-1}
.note textarea{width:100%;min-height:2.6em;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;padding:6px 8px}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--soft);font-size:.9rem}
.offline{background:var(--ask-bg);color:var(--ask);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}
@media (max-width:620px){.rule{grid-template-columns:minmax(0,1fr)}.save{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <h1>急救站佈局挑戰：遊戲規則審核</h1>
  <p class="lead">目前遊戲（V47）實際在跑的所有規則。綠色「11-18 已依回饋修改」是照你上次的備註改好的，請再看一次。每條按「同意」「要改」或「有疑問」，要改的寫在備註，存檔後 Claude 讀得到。</p>

</header>

    <button class="fbtn" type="button" data-f="change" aria-pressed="false">要改</button>

<script>
const G='g',K='k',A='a',V='v';
const SECTIONS=[
 {id:'site',t:'場地與佈置',rules:[
  ['S1','地圖格子 1 格 = 0.5 m（4 格 = 1 m²，約 13 格 = 1 坪）',[[K,'10-30']]],
  ['S2','內建場地：教室型（3 間教室各 8 × 9 m＋2 m 走廊；西端樓梯擔架不能過、東端坡道可以、教室 3 後門有台階、只有一間有水槽）；衛生所型（19 × 12 m，前門台階、後門平面、X 光室設備固定不能改用途）；地下空間（19 × 14 m，唯一出入口是西側樓梯）；長方形大廳；長條場地',[[K,'11-01、11-14'],[A,'場地虛構']]],
  ['S3','自訂場地：學員現場畫房間、塗格子、點插座／水槽／抵達點；可上傳照片當底圖並量比例尺；沒有抵達點或放不下 7 × 3 m 救護車就不能開始；預設載入「長方形大廳」範本',[[K,'11-02、11-14']]],
  ['S4','功能區用拖曳畫範圍，大小由學員決定；坪數不設下限，卡片只顯示建議值。佈置時右側「佈置檢查」與地圖驚嘆號會提示：各區容量（幾床、幾個座位，床位直接畫在地圖上；0 床標紅並說明原因）、患者或擔架走不到的區塊、指引配置原則（檢傷離出入口 >15 m、隔離／廢棄物／遺體緊貼公共空間、廢棄物緊貼休息區、行政與醫療合併、手術室緊貼遺體區，「緊貼」＝相距 1 m 內）',[[K,'11-18'],[G,'p.12–16、p.24'],[V,'11-18 已依回饋修改']]],
  ['S5','建議坪數：檢傷 4、重傷 4、中傷 3、輕傷 4、留觀 6、隔離 3、藥局 4、庫備品 4、公共空間 5、廢棄物 2、行政 5、遺體 5；重傷／中傷／輕傷三區合計 11 坪對應指引「診療處置區 11 坪」',[[G,'p.12–16'],[A,'三區拆分與留觀、隔離坪數']]],
  ['S6','相同功能的區塊緊貼在一起就算同一區（L 形也是）：外框畫一圈、名稱與坪數只標一次；拼起來是長方形的仍合成一塊',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
  ['S7','封鎖線：寬 0.5 m，水平或垂直，可封走道、門、空地；患者與擔架不能穿過，工作人員可以；不加不扣分',[[K,'11-01']]],
  ['S8','帳篷：方形或圓形（含橢圓），大小、數量不限，只能搭在室外；外圍 0.5 m 是帳篷布與營釘不能走；門寬 0.5 m 起、預設 1 m，開在每邊中間，不到 1 m 擔架過不去；內部算室內',[[K,'11-02'],[G,'附件五 p.41']]],
  ['S9','戶外空地（沒搭帳篷）或太小的區塊排不出床位和座位：佈置檢查會標紅並說明原因',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
 ]},
 {id:'patient',t:'患者',rules:[
  ['P1','4 小時共 24 人＋1 名死亡：輕 12、中 7（含 1 名疑似傳染）、重 5。前 2 小時門診 12 人穩定進站；第 2 小時起外傷 MCI 11 人＋死亡 1 人約 7 分鐘內湧入；第 3 小時後再 1 名輕症（多的 4 人門診、MCI 各 2）',[[K,'11-18'],[G,'p.6 只寫每日至少收治 50 人'],[V,'11-18 已依回饋修改']]],
  ['P2','動線：紅 入口→檢傷→重傷區→留觀→救護車轉出；黃 →檢傷→候診→中傷區→留觀或領藥出院；綠 →檢傷→候診→輕傷區→藥局→出口；黑 →檢傷→遺體區；疑似傳染 →檢傷→隔離區（不經公共空間）→轉出',[[K,'10-31'],[G,'p.12–16']]],
  ['P3','分流與借床：紅進重傷區、黃進中傷區、綠進輕傷區。客滿時紅可借中傷區、再借輕傷區；黃色躺床的可借重傷區、再借輕傷區，坐著的只用中傷、輕傷區；空床先給重症。輕症不跨區，輕傷區滿了就在公共空間候診',[[K,'11-18'],[V,'11-18 已依回饋修改']]],

  ['P6','輕症 10% 處置後轉重症：改躺、用擔架移到重傷區（等床時留在原位），再照重症處置與轉出；基本 20 人固定 1 人',[[K,'10-31']]],
  ['P7','移動速度：步行 1 m/s；擔架減半；走樓梯步行再減半、擔架只剩 2 成',[[A,'']]],
  ['P8','佔地：坐 1 × 1 m、躺 1 × 2 m（可直放橫放）；輕症全坐、重症全躺、中症一半躺（擔架來的一定躺）；疑似傳染躺',[[K,'10-30']]],
  ['P9','床位（所有躺床：重傷、中傷、留觀、隔離、BORP 檢傷分類區、術後恢復區）：先試同方向成排，也試直放、橫放混著擺，取床最多、而且每張床擔架都推得到的排法；床頭外 0.5 m 站醫師做頭部處置，頭對頭兩床可共用；重傷區的床兩個長邊外各 0.5 m 站人處置（可與隔壁床共用、區塊邊緣也要留），其他區床與床之間都隔 0.5 m，每床至少一側站得了人（靠區塊邊緣的那床可以只有一側）；每兩排之間 1 m 走道（放不下時 0.5 m）。候診座位不分組，有空位就整排排滿；窄的公共空間也能排兩排以上，擋到出入口或擔架路線的座位才拿掉。遺體區床仍緊貼併排',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
  ['P10','（已併入 P9）重症床長邊外的 0.5 m 走道',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
  ['P11','（已併入 P9）床頭 0.5 m 改為所有躺床都要，且頭對頭兩床可共用',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
  ['P12','患者是障礙物不能跨越；擺床時一定留通道（擔架 1 m、步行 0.5 m）。擺下一張床只要不讓「原本到得了的人」變到不了就可以；擔架從入口或救護車區算起',[[K,'10-30'],[A,'11-15 修正停擺']]],
  ['P13','患者不能穿越遺體區、庫備品區、廢棄物區、手術室（送往該區的除外）；其他功能區有走道就繞走道；公共空間與救護車區可通行；工作人員不受限',[[K,'10-31'],[A,'']]],
  ['P14','以坪數算位子的區：檢傷每 2 坪 1 位、藥局窗口每 2 坪 1 位、遺體每 1.25 坪 1 位；面積連 1 位都不夠時仍給 1 位，但處置時間 ×1.8',[[A,'']]],
  ['P15','擁擠：每格最多 2 人（擔架算 2）；被擋 3 秒後硬擠過去',[[A,'']]],
  ['P16','路被擋住：卡 1 分鐘先把擋路的床位或座位挪到同功能區別的位子（被挪的人處置多 1 分）；挪不動，卡 2 分鐘從患者旁邊擠過去、速度減半（牆、設備、封鎖線、管制區照樣不能穿）；被區塊整個堵死，卡 5 分鐘就地設臨時醫療點；要出站或轉送的人力抬出。不自動搬動功能區',[[K,'11-15'],[A,'秒數']]],

 ]},

  ['T2','處置人力：輕症 1 醫師或 1 護理師（誰先空誰來）；人力極度緊繃（沒有空閒醫師、護理師）時藥師也可以處置輕症，順序是發藥＞後勤＞輕症，處置時間是護理師的 2 倍；紅、黃與隔離 1 醫師＋1 護理師全程；檢傷、留觀評估（2 分）各 1 護理師；領藥藥師',[[K,'11-18'],[V,'11-18 已依回饋修改']]],
  ['T3','重症插隊：沒有空閒人手時中斷綠、黃的處置先救重症，先調綠再調黃；被中斷的患者暫停，等人回來接著做',[[K,'']]],

  ['T5','檢傷護理師空檔協助：檢傷區沒人在等時，可進診療區（重、中、輕傷區）協助任何顏色患者，不限時；協助中有紅色來檢傷就立刻回（手上的患者改等其他護理師），黃、綠色來檢傷就等她做完手上這位',[[K,'11-17']]],

  ['T8','領物資：躺床患者處置時，志工或替代役到藥局、庫備品區各停 30 秒再送到床邊；處置做到一半物資還沒到就暫停並計入延誤；走路的輕症自己去藥局領藥',[[K,'10-31'],[A,'30 秒']]],

const ALL=SECTIONS.flatMap(s=>s.rules.map(r=>r[0]));
const LABEL={ok:'同意',change:'要改',ask:'有疑問'};
let state={},filter='all',db=null,editing=new Set();
try{state=JSON.parse(localStorage.getItem('rules-review')||'{}')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tagHTML(tags){return tags.map(([k,v])=>`<span class="tag ${k}">${k===V?esc(v):(k===G?'指引':k===K?'焜哥決定':'遊戲假設')+(v?' '+esc(v):'')}</span>`).join('')}
function build(){
  $('#toc').innerHTML=SECTIONS.map(s=>`<a href="#${s.id}">${esc(s.t)}</a>`).join('');
  $('#list').innerHTML=SECTIONS.map(s=>`<section id="${s.id}"><h2>${esc(s.t)}<small>${s.rules.length} 條</small></h2>${s.rules.map(([id,txt,tags])=>`
    <article class="rule" id="r-${id}" data-id="${id}">
      <div class="txt"><p><span class="id">${id}</span>${esc(txt)}</p><div>${tagHTML(tags)}</div></div>
      <div class="acts" role="group" aria-label="${id} 判定">${['ok','change','ask'].map(v=>`<button type="button" data-v="${v}" aria-pressed="false">${LABEL[v]}</button>`).join('')}</div>
      <div class="note"><textarea id="n-${id}" aria-label="${id} 備註" placeholder="備註（要改成怎樣、或你的疑問）"></textarea></div>
    </article>`).join('')}<p class="empty" hidden>這一章沒有符合篩選的規則</p></section>`).join('');
}
function paint(){
  let ok=0,ch=0,ask=0;
  document.querySelectorAll('.rule').forEach(el=>{const id=el.dataset.id,r=state[id]||{};
    el.dataset.s=r.status||'';
    el.querySelectorAll('.acts button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===r.status)));
    const ta=el.querySelector('textarea');if(!editing.has(id)&&ta.value!==(r.note||''))ta.value=r.note||'';
    if(r.status==='ok')ok++;else if(r.status==='change')ch++;else if(r.status==='ask')ask++;
    const show=filter==='all'||(filter==='todo'?!r.status:r.status===filter);el.hidden=!show});
  document.querySelectorAll('section').forEach(s=>{s.querySelector('.empty').hidden=!!s.querySelector('.rule:not([hidden])')});
  const n=ALL.length,done=ok+ch+ask;
  $('#nums').textContent=`已審 ${done} / ${n} 條・同意 ${ok}・要改 ${ch}・有疑問 ${ask}`;
  const w=v=>(v/n*100).toFixed(2)+'%';
  $('#track').innerHTML=`<i style="width:${w(ok)};background:var(--ok)"></i><i style="width:${w(ch)};background:var(--chg)"></i><i style="width:${w(ask)};background:var(--ask)"></i>`;
}
function keepLocal(){try{localStorage.setItem('rules-review',JSON.stringify(state))}catch(e){}}
async function persist(id){
  keepLocal();
  if(!db){$('#save').textContent='只存在這台裝置';return}
  $('#save').textContent='儲存中…';
  try{await db.collection('reviews').doc(id).set({status:state[id].status||null,note:state[id].note||'',at:new Date().toISOString()});$('#save').textContent='已儲存'}
  catch(e){$('#save').textContent='沒存成功，請再按一次'}
}
build();paint();
document.addEventListener('click',ev=>{
  const f=ev.target.closest('.fbtn');if(f){filter=f.dataset.f;document.querySelectorAll('.fbtn').forEach(b=>b.setAttribute('aria-pressed',String(b===f)));paint();return}
  const b=ev.target.closest('.acts button');if(!b)return;const id=b.closest('.rule').dataset.id,r=state[id]=state[id]||{};
  r.status=r.status===b.dataset.v?null:b.dataset.v;paint();persist(id)});
const timers={};
document.addEventListener('input',ev=>{const ta=ev.target.closest('textarea');if(!ta)return;const id=ta.closest('.rule').dataset.id;editing.add(id);
  (state[id]=state[id]||{}).note=ta.value;clearTimeout(timers[id]);timers[id]=setTimeout(()=>persist(id),800)});
document.addEventListener('focusout',ev=>{const ta=ev.target.closest&&ev.target.closest('textarea');if(!ta)return;const id=ta.closest('.rule').dataset.id;editing.delete(id);clearTimeout(timers[id]);if(state[id])persist(id)});
(async()=>{
  const d=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!d){$('#offline').hidden=false;$('#save').textContent='只存在這台裝置';return}
  db=d;$('#save').textContent='已連上';
  db.collection('reviews').onSnapshot(snap=>{snap.docs.forEach(doc=>{const v=doc.data();if(v)state[doc.id]={status:v.status||null,note:v.note||''}});keepLocal();paint()},()=>{$('#save').textContent='資料庫連線中斷'});
})();
</script>
